<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Truths and a Lie</title>
</head>
<body style="background-color: beige;">
    <h1>Max's Truth and Lie game</h1>
    <hr>

    <h2>Introductions</h2>
    <form action="" id="name-form">
        <label for="fname">First Name</label><br />
        <input type="text" name="fname" id="fname"><br />
        <label for="lname">Last Name</label><br />
        <input type="text" name="lname" id="lname"><br />
        <label for="age">Age</label><br />
        <input type="number" name="age" id="age"><br />
    </form>
    <br />
    <input type="button" value="SUBMIT" onclick="greet();">
    <p id="greet" style="font-size: x-large;">Welcome</p>

    <h2>Warm up trivia question</h2>
    <p>What is the only food that cannot go bad</p>
    <p id="trivia1-answer"></p>
    <form action="">
        <input type="radio" name="trivia1" id="chocolate">
        <label for="chocolate">Dark Chocolate</label><br/>
        <input type="radio" name="trivia1" id="tuna">
        <label for="tuna">Tuna</label><br/>
        <input type="radio" name="trivia1" id="honey">
        <label for="honey">Honey</label><br/>
        
    </form>
    <input type="button" value="SUBMIT" onclick="trivia1()">

   
    <hr>
    <h2>Two Truths and a Lie</h2>
    <p>Two of these are true and one is a lie. Which one is the lie?</p>
    <p>Press START, then you have 10 seconds to answer!</p>
    <input type="button" value="START" id="ttl-start" onclick="startTimer()">
    <p id="ttl-timer" style="font-size: x-large;">Time left: 10</p>
    <p id="ttl-answer"></p>
    <form action="">
        <input type="radio" name="ttl" id="statement1" disabled>
        <label for="statement1">I have been to Japan</label><br/>
        <input type="radio" name="ttl" id="statement2" disabled>
        <label for="statement2">I speak German</label><br/>
        <input type="radio" name="ttl" id="statement3" disabled>
        <label for="statement3">I am a cat person</label><br/>
    </form>
    <input type="button" value="SUBMIT" id="ttl-submit" onclick="twoTruthsLie()" disabled>
    

    <script src="javascript/truth.js"></script>
</body>
</html>
